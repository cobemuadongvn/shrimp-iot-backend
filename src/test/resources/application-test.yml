spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000,http://192.168.1.7:5173

iot:
  api-key: TEST_KEY

auth:
  token-expiration-hours: 24

auto-control:
  enabled: false
  cooldown-seconds: 120
  relay:
    pump: 1
    water-fan: 2
    oxygen: 3
    spare: 4

threshold:
  temperature:
    min: 20
    max: 35
  ph:
    min: 6.5
    max: 8.5
  salinity:
    min: 0
    max: 35
  dissolved-oxygen:
    min: 4

mqtt:
  enabled: false
