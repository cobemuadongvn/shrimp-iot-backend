name: Render Keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-keepalive
  cancel-in-progress: true

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend readiness endpoint
        run: |
          curl --silent --show-error --fail \
            --max-time 120 \
            --retry 3 \
            --retry-delay 20 \
            https://shrimp-iot-backend.onrender.com/api/health/ready
