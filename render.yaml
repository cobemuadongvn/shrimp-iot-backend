# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

services:
  - type: web
    name: shrimp-iot-backend
    runtime: docker
    # Temporary user choice to avoid payment setup during initial deployment.
    # For MQTT-heavy 24/7 usage, Free can spin down and miss telemetry.
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: DB_POOL_MAX_SIZE
        value: "5"
      - key: DB_POOL_MIN_IDLE
        value: "1"
      - key: FLYWAY_ENABLED
        value: "true"
      - key: FLYWAY_BASELINE_ON_MIGRATE
        value: "false"
      - key: JPA_DDL_AUTO
        value: validate
      - key: JPA_SHOW_SQL
        value: "false"
      - key: IOT_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: MQTT_ENABLED
        value: "true"
      - key: MQTT_BROKER_URL
        sync: false
      - key: MQTT_USERNAME
        sync: false
      - key: MQTT_PASSWORD
        sync: false
      - key: MQTT_TLS_REQUIRED
        value: "true"
      - key: MQTT_HOSTNAME_VERIFICATION_ENABLED
        value: "true"
      - key: MQTT_CREDENTIALS_REQUIRED
        value: "true"
      - key: MQTT_BACKEND_CLIENT_ID
        value: shrimp-iot-backend-render
      - key: AI_ENABLED
        value: "false"
      - key: AI_SERVICE_URL
        sync: false
      - key: OPENAI_CHAT_ENABLED
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: SEED_DEMO_DATA_ENABLED
        value: "false"
      - key: AUTO_CONTROL_ENABLED
        value: "false"
      - key: PROVISIONING_CLAIM_EXPIRATION_MINUTES
        value: "1440"

  - type: web
    name: shrimp-iot-ai
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: ./ai-service
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
